[pytest]
# Only collect unit tests from the three backend service directories.
# The root-level test_ecommerce.py is an integration test that requires a
# live AWS deployment and must not be collected during CI unit-test runs.
testpaths =
    backend/cart
    backend/order
    backend/product

# importlib mode gives each lambda_function.py its own unique module
# identity in sys.modules (e.g. backend.cart.lambda_function) so that
# pytest never serves a cached module from a different service to a test
# that does `import lambda_function`.
addopts = --import-mode=prepend
